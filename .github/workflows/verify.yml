name: Exact verification
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install exact dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Full exact replay
        run: python run_all.py
      - name: Guard and corruption controls
        run: python public_controls.py
      - name: Public privacy scan
        run: python privacy_scan.py
